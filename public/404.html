<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOQA ATELIER</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // If a user navigates directly to a subpath without a hash (e.g. /clothing/product/CLOTH-DQA-001),
      // this script redirects them to the corresponding hash route (/clothing/#/product/CLOTH-DQA-001)
      (function() {
        var path = window.location.pathname.replace(/^\/clothing\/?/, '');
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var destination = '/clothing/' + (path ? '#/' + path : '') + search + hash;
        window.location.replace(destination);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/clothing/">DOQA ATELIER</a>...</p>
  </body>
</html>
